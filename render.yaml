services:
  - type: web
    name: urbanfix-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: urbanfix-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install; npm run web:build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: urbanfix-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_API_KEY
        generateValue: true
      - key: AI_CORS_ORIGINS
        value: https://urban-fix-ai.onrender.com,https://urbanfix-web.onrender.com,https://urbanfix-api.onrender.com
