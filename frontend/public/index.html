<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /*
       * UrbanFix fix: the app's first screen (Onboarding/Splash) is dark navy
       * (#020205), but the browser paints this document white by default
       * before any JS runs. On a slow network, slow font load, or a stalled
       * bundle, that gap is visible as a "white screen" — which is exactly
       * what was reported as "theme changed to white / app not opening".
       * Painting the shell dark from byte one removes that gap entirely,
       * independent of any JS/font/network timing.
       */
      html,
      body {
        background-color: #020205;
      }
      #root {
        background-color: #020205;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
